[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "1", features = ["preserve_order"] }
toml_edit = "0.25"
jsonschema = { version = "0.60", default-features = false }
notify-debouncer-mini = "0.6"
include_dir = "0.7"
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
log = "0.4"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2

# The maths crates are slow without optimisations, even in tests.
[profile.dev.package.lps-evaluator]
opt-level = 3

[profile.dev.package.lps-equity]
opt-level = 3

[profile.dev.package.lps-icm]
opt-level = 3
