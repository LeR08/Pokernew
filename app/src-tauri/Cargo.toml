[package]
name = "local-poker-suite"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Local Poker Suite desktop app (Tauri shell)"
default-run = "local-poker-suite"

[lib]
name = "lps_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "local-poker-suite"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger = "0.11"
tokio = { version = "1", features = ["sync"] }
lps-config = { path = "../../crates/config" }
lps-db = { path = "../../crates/db" }
lps-hh-parsers = { path = "../../crates/hh-parsers" }
lps-stats-engine = { path = "../../crates/stats-engine" }
lps-core-model = { path = "../../crates/core-model" }
rusqlite = "0.37"
dirs = "6"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
lps-hud-overlay = { path = "../../crates/hud-overlay" }
lps-equity = { path = "../../crates/equity" }
lps-evaluator = { path = "../../crates/evaluator" }
regex = "1"

[dev-dependencies]
tempfile.workspace = true
