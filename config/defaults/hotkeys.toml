# Raccourcis clavier de l'application / in-app keyboard shortcuts
# Format : modificateurs (Ctrl, Alt, Shift, Meta) + touche, séparés par "+".
# Format: modifiers (Ctrl, Alt, Shift, Meta) + key, joined with "+".
# Les raccourcis globaux (hors application) arrivent avec le HUD (phase 3).
# Global (system-wide) hotkeys arrive with the HUD (phase 3).

[actions]
go_home = "Ctrl+H"
open_settings = "Ctrl+,"
toggle_sidebar = "Ctrl+B"
next_profile = "Ctrl+P"
# Raccourcis globaux (fonctionnent même quand le client poker a le focus)
# Global hotkeys (work while the poker client has the focus)
toggle_hud = "Ctrl+Alt+H"
hud_edit = "Ctrl+Alt+E"
