# Disposition du HUD / HUD layout
#
# FR : chaque joueur a un panneau de cellules. `rows` = les lignes du panneau
#      (identifiants de stats/*.toml, plus "hands" pour le nombre de mains).
#      `popup` = les stats du panneau détaillé (survol en mode inspection).
#      Les positions des panneaux sont relatives à la table : x et y entre 0 et 1
#      (0,0 = coin haut-gauche de la zone de jeu). « slot 0 » = le héros, puis les
#      sièges dans le sens des aiguilles d'une montre. Le plus simple : passe en mode
#      édition (Ctrl+Alt+E ou module HUD) et déplace les panneaux à la souris.
# EN : rows = stat ids shown in each player panel; positions are relative (0–1).

name = "Standard"
opacity = 0.85
font_scale = 1.0
# Afficher le panneau du héros / show the hero's own panel
show_hero = true
# Griser les stats avec moins de N mains / dim stats with fewer than N hands
min_hands = 20
rows = [
  ["vpip", "pfr", "three_bet", "hands"],
  ["af", "cbet_flop", "fold_to_cbet_flop", "wtsd"],
]
popup = [
  "vpip", "pfr", "three_bet", "fold_to_3bet", "steal", "fold_to_steal",
  "cbet_flop", "fold_to_cbet_flop", "wtsd", "wsd", "wwsf", "af",
]

# Positions par taille de table : une paire [x, y] par slot (0 = héros).
