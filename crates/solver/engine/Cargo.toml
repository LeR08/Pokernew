# Vendored fork of postflop-solver by Wataru Inariba (https://github.com/b-inary/postflop-solver),
# AGPL-3.0-or-later. Upstream development is paused; this copy is maintained here
# (upstream commit in UPSTREAM_COMMIT, our changes in FORK.md).
[package]
name = "postflop-solver"
version = "0.1.0"
authors = ["Wataru Inariba"]
edition = "2021"
description = "An open-source postflop solver for Texas hold'em poker (vendored fork)"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
bincode = { version = "=2.0.0-rc.3", optional = true }
# keeps bincode's derive macros on the same release candidate
bincode_derive = { version = "=2.0.0-rc.3", optional = true }
once_cell = "1.18.0"
rayon = { version = "1.8.0", optional = true }
regex = "1.9.6"
zstd = { version = "0.12.4", optional = true, default-features = false }

[features]
default = ["bincode", "rayon", "zstd"]
bincode = ["dep:bincode", "dep:bincode_derive"]
custom-alloc = []
rayon = ["dep:rayon", "zstd?/zstdmt"]
